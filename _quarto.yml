project:
  type: website
  output-dir: docs
  render:
    - section*.qmd
    - "*.qmd"
    - "!ignored.qmd"
    - "!ignored-dir/"
    
website:
  title: "Shiao-li Green"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - projects.qmd
  page-footer:
    center: 
      - icon: github
        href: https://github.com/shiaoligreen
      - icon: linkedin
        href: https://www.linkedin.com/in/shiao-ligreen/

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    smooth-scroll: true
    include-in-header:
      text: |
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">



